  - gmsh
  - jax==0.5.0
  - jaxopt
  - numpy
  - pygmo
  - python-gmsh
  - trame
  - ipywidgets
  - jupyterlab
  - scipy
  - scikit-learn
  - pyvista
  - typeguard
  - yaml
  - pygraphviz
  - matplotlib
  - pip
  - pip:
      - git+https://github.com/cpml-au/dctkit
      - git+https://github.com/cpml-au/deap
      - "ray[default]"
